<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Connect4</title>
	<link rel="stylesheet" href="style.css">
	<meta name="description" content="Connect4 — University style full-stack project with AI and network play">
	</head>

<body>
	<header>
		<h1>Connect 4</h1>
	</header>

	<main>
		<section id="controls" aria-label="Game controls">
			<label for="playerName">Name:</label>
			<input id="playerName" type="text" placeholder="Player" aria-label="Player name">

			<label for="mode">Mode:</label>
			<select id="mode" aria-label="Game mode">
				<option value="local">Player vs Player (local)</option>
				<option value="ai">Player vs AI</option>
			</select>

			<label for="aiLevel">AI Level:</label>
			<select id="aiLevel" aria-label="AI level">
				<option value="1">1 - Random</option>
				<option value="2">2 - Intermediate</option>
				<option value="3">3 - Advanced</option>
			</select>

			<button id="start">Start Game</button>
			<button id="reset">Reset Game</button>

		</section>

		<section id="gameArea">
			<div id="status" role="status" aria-live="polite">Press Start to begin</div>
			<div id="boardContainer">
				<div id="board" role="grid" aria-label="Connect 4 board"></div>
			</div>
		</section>

		<section id="leaderboardSection">
			<h2>Leaderboard</h2>
			<table id="leaderboard" aria-label="Leaderboard"></table>
		</section>
	</main>

	<footer>
		<small>Accessibility: keyboard navigation supported (← → to move, Enter to drop)</small>
	</footer>
	<script>console.log('CSS loaded?', document.stylesheets.length)</script>
	<script src="game.js"></script>
</body>
</html>
